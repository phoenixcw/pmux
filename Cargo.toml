[package]
name = "pmux"
version = "0.1.0"
edition = "2024"
description = "Associate filesystem paths with tags and list them back by tag"
license = "MIT"
repository = "https://github.com/phoenixcw/pmux"
readme = "README.md"

[dependencies]
clap = { version = "4.6.6", features = ["derive"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"
